<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#367b60"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Gut Diary"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Gut Diary</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#263d32;background:#f8faf5}*{box-sizing:border-box}body{margin:0}main{max-width:530px;margin:auto;padding:22px 17px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:3px 0 7px}h2{font-size:19px}h3{font-size:15px;margin:0 0 10px}.muted{color:#6f8075;font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#608a73;font-weight:700}.card{background:white;border:1px solid #e3eae2;border-radius:18px;padding:17px;margin:14px 0;box-shadow:0 3px 14px #244b3010}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#e9f2e9;padding:14px;border-radius:15px}.stat strong{font-size:23px;display:block}button{cursor:pointer;font:inherit}.primary,.secondary{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px}.primary{background:#367b60;color:white}.secondary{background:#e8f1e9;color:#286348}.full{width:100%}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #e1e8e0;padding-bottom:env(safe-area-inset-bottom);z-index:3}nav button{width:20%;max-width:106px;background:none;border:0;padding:11px 1px;color:#829087;font-size:11px}nav button span{display:block;font-size:21px;margin-bottom:4px}nav button.active{color:#287553;font-weight:800}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{padding:12px 0;border-bottom:1px solid #edf0ec}.item:last-child{border:0}.pill{display:inline-block;background:#edf3eb;border-radius:20px;padding:5px 9px;margin:3px;font-size:11px;color:#4a7057}.bar{height:8px;border-radius:10px;background:#e9eee8;overflow:hidden;margin-top:7px}.fill{height:100%;background:#75a88c}.field{margin:13px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #cbd9cd;border-radius:11px;back </style></head><body><main><div id="app"></div></main><nav id="nav"></nav><dialog id="modal"></dialog><script src="app.js" defer></script></body></html>
